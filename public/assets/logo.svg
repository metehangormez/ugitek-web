<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="UGİTEK logosu">
  <defs>
    <linearGradient id="ug-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="55%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#f05a0a"/>
    </linearGradient>
    <linearGradient id="ug-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b6bff"/>
      <stop offset="100%" stop-color="#0f2043"/>
